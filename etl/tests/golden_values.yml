# Golden-value anchor fixture (E2-11a).
#
# Contract test #12 (etl/tests/test_contracts.py::test_c12_golden_values_match_stored_ranks)
# reads this file after every ETL run and asserts that Pats season-end ranks
# match the recorded values. Any drift flags an investigation.
#
# ─── Two levels of anchoring ─────────────────────────────────────────────────
#   source=self : baseline captured from the first clean backfill (2026-04-19).
#                 Catches aggregation-logic drift (filter changes, rank-tiebreak
#                 tweaks, sample-size edits) that would move ranks from same
#                 input data. Does NOT catch source-data drift (nflverse EPA
#                 model shift, upstream schema reinterpretation).
#   source=rbsdm / sumer : externally-computed rank from an independent source.
#                 Upgrade entries to this level opportunistically — catches both
#                 aggregation drift AND source-data drift.
#
# To upgrade a row: visit rbsdm.com/stats/stats/, filter to the season + NE +
# phase, record the rank, and set source to the rbsdm URL + recorded_on date.
# If the external rank differs from ours, investigate before overwriting.
#
# ⚠ 2026-08-26: every defensive row below was WRONG from 2026-04-19 until now.
# Defensive ranks were inverted league-wide (bd patsbythenumbers-78e) and these
# anchors were captured from that buggy output, so they locked the bug in
# rather than catching it. They have been re-recorded from the corrected
# aggregation — but they are still source=self, i.e. still anchored to our own
# arithmetic. Upgrading even ONE defensive row to source=rbsdm would have
# surfaced this in April. Do that before trusting this file on defense.

