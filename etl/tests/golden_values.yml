# Golden-value anchor fixture (E2-11a).
#
# Contract test #12 (etl/tests/test_contracts.py::test_c12_golden_values_match_stored_ranks)
# reads this file after every ETL run and asserts two things per row:
#
#   1. team_phase_season.rank == expected_rank      (exact)
#   2. |team_phase_season.rank - rbsdm_rank| <= 2   (when rbsdm_rank is present)
#
# ─── Three levels of anchoring ───────────────────────────────────────────────
#   source=self
#       Captured from our own ETL output. Catches nothing on its own: if the
#       aggregation is wrong, the anchor is wrong the same way. This is how the
#       inverted defensive ranks (bd patsbythenumbers-78e) lived from
#       2026-04-19 to 2026-08-26, and how scrambles-as-rushes
#       (bd patsbythenumbers-tbc) lived until 2026-09-12.
#   source=nflverse-independent
#       Reproduced by `etl/scripts/verify_anchors.py`, which reads the nflverse
#       parquet release directly and shares no code with etl/. Catches
#       aggregation drift and drift between our `plays` table and the current
#       nflverse release. Does NOT catch an nflfastR EPA-model change (both
#       sides would move together).
#   rbsdm_rank
#       NE's rank on rbsdm.com/stats/stats/ (Offense / Defense tabs, Dropback
#       EPA and Rush EPA columns, regular season, all downs, all quarters,
#       0% garbage-time filter). rbsdm runs the same nflfastR EPA model but
#       its `pass`/`rush` flags keep penalty no_play rows that §1.2 excludes,
#       so ranks land within one or two places of ours, never further. A
#       78e-style inversion moves a rank by 10-28 places; tolerance 2 catches
#       that and tolerates the known filter gap.
#
# rbsdm publishes no team EPA differential, so the `overall` rows have no
# rbsdm_rank. They are still nflverse-independent.
#
# ─── How to re-verify ────────────────────────────────────────────────────────
#   cd etl && uv run python -m etl.scripts.verify_anchors
#
# To re-record an rbsdm_rank: open rbsdm.com/stats/stats/, set Season Min and
# Max to the season and Regular Week Max to 18 (17 for 2020), type the values
# with the keyboard (programmatic form fill does not fire the Shiny events),
# click Update, then sort the Dropback EPA / Rush EPA column on the Offense or
# Defense tab. Record NE's position and the date in rbsdm_on.
#
# If verify_anchors.py disagrees with a row, the ETL aggregation drifted.
# Investigate before overwriting. If rbsdm disagrees by more than 2, the same.
#
# ─── History ─────────────────────────────────────────────────────────────────
# 2026-04-19  First clean backfill; all rows source=self.
# 2026-08-26  Defensive rows re-recorded after 78e (inverted ranks).
# 2026-09-12  rush_offense / run_defense re-recorded after tbc (scrambles).
# 2026-09-12  All 30 rows upgraded to nflverse-independent; 24 pass/rush rows
#             got rbsdm_rank. 14 of 24 match rbsdm exactly, 9 differ by one
#             place, 2022 run_defense differs by two (ours 9, rbsdm 11; NE is
#             within 0.002 EPA of two neighbours). See bd patsbythenumbers-0ab.
#
# The earlier note that SumerSports ranked NE's 2022 run defense "~24th" was a
# misread. Sumer's 2022 defensive table (read 2026-09-12) shows NE at -0.12
# EPA/rush allowed, 3rd or 4th in the league. Sumer also moved its 2022 NE
# EPA/pass from -0.11 to -0.14 between 2026-08-26 and 2026-09-12 — their model
# is re-fit, so it is not a stable anchor. rbsdm is.


entries:
