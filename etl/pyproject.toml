[project]
name = "etl"
version = "0.1.0"
description = "28 and Three — ETL for nflverse PBP → Neon Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
  # nflverse ingest deps (nfl_data_py / nflreadpy / pyarrow) land in E2.
  # E1 ships only the heartbeat path, so keep the install surface small.
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "sentry-sdk>=2.19.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
