[project]
name = "etl"
version = "0.1.0"
description = "28 and Three — ETL for nflverse PBP → Neon Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "sentry-sdk>=2.19.0",
  # E2 nflverse ingest. nflreadpy is the maintained successor to nfl_data_py;
  # see docs/solutions/build-errors/nfl-data-py-pandas-python-312-build-failure.md
  # for the dep we explicitly rejected.
  # Pinned exact per HANDOVER \u00A74 \u2014 upstream schema drift is the #1 ETL
  # failure mode. Bump deliberately after running contract tests against a
  # candidate version. Procedure in docs/runbook.md#etl-failure.
  "nflreadpy==0.1.5",
  "polars>=1.12.0",
  "pyarrow>=17.0.0",
  "pyyaml>=6.0.2",  # for golden_values.yml (E2-11a contract test fixture)
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
  "integration: requires TEST_DATABASE_URL (local Postgres) — skipped otherwise",
]
