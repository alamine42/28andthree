name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Disable Next telemetry in CI noise.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  web:
    name: Web — typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The build prerenders phase/player pages. Without a database those
      # readers return nothing, the notFound() guards fire, and the 404 is
      # baked into the artifact the e2e job then serves. See PR #16.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # `.next` is a dot-directory, and upload-artifact excludes hidden
      # paths by default — without include-hidden-files the glob matches
      # nothing. if-no-files-found: error makes that fail here, in the job
      # that builds, instead of handing a green light to the e2e job that
      # then dies on a missing artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: E2E — chromium smoke
    runs-on: ubuntu-latest
    # 180 tests, one worker. Measured at 6m10s locally against a seeded
    # database with retries off; CI adds install + browser download, and
    # retries: 2 multiplies any failure. 15 minutes cancelled the job
    # mid-run. 30 leaves headroom without letting a hang sit forever.
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Playwright browsers cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: pnpm exec playwright test --project=chromium --reporter=github
        env:
          CI: '1'
          # `next start` serves the downloaded build, but ISR revalidation
          # and the dynamic /s routes still query at request time.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
