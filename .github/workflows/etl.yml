name: ETL (weekly)

on:
  # 14:00 UTC on Tuesday = 10:00 ET during DST, 09:00 ET otherwise.
  # DST-boundary runs (Nov/Mar) are exercised via the E1-09 acceptance test.
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: freshness-gate
        options: [freshness-gate, heartbeat, season, full]
      season:
        description: 'Season (if mode=season)'
        required: false
        type: string
      week:
        description: 'Week (optional, with mode=season)'
        required: false
        type: string

permissions:
  contents: read

# Primary + retry runs (see etl-retry.yml) share the same freshness-gate. No
# cross-run state coordination — whichever fires first with fresh data runs
# the ETL; subsequent fires find max(week) == nflverse's and exit heartbeat.
jobs:
  etl:
    name: ETL — nflverse → Neon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ETL deps
        working-directory: etl
        run: uv sync --frozen

      # All "run" invocations below execute from repo root so `python -m etl.main`
      # resolves correctly: cwd=repo root → PYTHONPATH=. → `etl` is the package.
      - name: Scheduled run — gate then refresh if fresh
        if: ${{ github.event_name == 'schedule' }}
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
          SENTRY_MONITOR_SLUG: etl-weekly
        run: |
          CURRENT_SEASON=$(date +%Y)
          if [ "$(date +%m)" -lt "03" ]; then CURRENT_SEASON=$((CURRENT_SEASON - 1)); fi
          echo "Derived current NFL season: $CURRENT_SEASON"
          uv run --project etl python -m etl.main --season "$CURRENT_SEASON"

      - name: Manual freshness-gate only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'freshness-gate' }}
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
        run: uv run --project etl python -m etl.main --freshness-gate

      - name: Manual heartbeat
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'heartbeat' }}
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
          SENTRY_MONITOR_SLUG: etl-weekly
        run: uv run --project etl python -m etl.main --heartbeat

      - name: Season refresh (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'season' }}
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            uv run --project etl python -m etl.main --season ${{ inputs.season }} --week ${{ inputs.week }}
          else
            uv run --project etl python -m etl.main --season ${{ inputs.season }}
          fi

      - name: Full backfill (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
        run: uv run --project etl python -m etl.main --full

      - name: Contract tests
        env:
          TEST_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
        run: uv run --project etl pytest etl/tests/test_contracts.py --tb=short

      - name: Revalidate ISR cache
        if: ${{ success() && github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'freshness-gate' && inputs.mode != 'heartbeat') }}
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -z "$REVALIDATE_TOKEN" ]; then
            echo "REVALIDATE_TOKEN not set — skipping cache flush (pages will self-heal within 1h via ISR TTL)."
            exit 0
          fi
          # Empty paths array → endpoint revalidates the full allowlist
          # (lib/revalidation/tags.ts). Single source of truth stays in TS.
          curl -fsS -X POST https://28andthree.com/api/revalidate \
            -H "x-revalidate-token: $REVALIDATE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"paths":[]}'
