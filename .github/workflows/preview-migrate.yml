name: Preview migration

on:
  # Fires when Vercel reports a preview deployment is ready for a PR.
  # We run drizzle-kit migrate against the per-PR Neon branch BEFORE any tests
  # touch the preview URL. This closes the gap flagged in the E1 adversarial
  # review (finding #1): without this, a PR that adds a column would deploy
  # against a stale preview-branch schema.
  deployment_status:
  workflow_dispatch:
    inputs:
      database_url:
        description: 'Preview branch MIGRATOR_DATABASE_URL (manual runs only)'
        required: true
        type: string

jobs:
  migrate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          # Populated by Neon-Vercel integration as a per-PR branch URL.
          # See docs/runbook.md#preview-migrations for setup.
          MIGRATOR_DATABASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.database_url || secrets.PREVIEW_MIGRATOR_DATABASE_URL }}
        run: pnpm db:migrate
