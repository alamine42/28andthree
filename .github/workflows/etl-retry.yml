name: ETL retry (weekly)

# Retry windows for the primary Tuesday ETL. Same script as etl.yml with the
# same freshness-gate; if the primary already loaded this week's data, the
# gate exits 0 (heartbeat). No cross-run state coordination.
#
# 18:00 UTC ≈ 14:00 ET · 22:00 UTC ≈ 18:00 ET.

on:
  schedule:
    - cron: '0 18 * * 2'
    - cron: '0 22 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retry:
    name: ETL retry — gate then refresh if fresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ETL deps
        working-directory: etl
        run: uv sync --frozen

      - name: Gate + refresh if fresh
        env:
          ETL_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
          SENTRY_DSN_ETL: ${{ secrets.SENTRY_DSN_ETL }}
          SENTRY_MONITOR_SLUG: etl-weekly
        run: |
          CURRENT_SEASON=$(date +%Y)
          if [ "$(date +%m)" -lt "03" ]; then CURRENT_SEASON=$((CURRENT_SEASON - 1)); fi
          echo "Derived current NFL season: $CURRENT_SEASON"
          uv run --project etl python -m etl.main --season "$CURRENT_SEASON"

      - name: Contract tests
        env:
          TEST_DATABASE_URL: ${{ secrets.ETL_DATABASE_URL }}
        run: uv run --project etl pytest etl/tests/test_contracts.py --tb=short
