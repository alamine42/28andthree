name: Sandbox isolation sentinel

# Fail CI if a prod build accidentally contains fixture bytes. The
# next.config.ts alias should have scrubbed them; this is the belt to
# that suspenders. See docs/sandbox.md for how aliasing works.

on:
  pull_request:
    paths:
      - 'lib/sandbox/**'
      - 'next.config.ts'
      - 'package.json'
      - '.github/workflows/sandbox-isolation.yml'
  push:
    branches: [main]

jobs:
  grep-prod-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build prod bundle (sandbox off)
        run: pnpm build
        env:
          NEXT_PUBLIC_SANDBOX_MODE: ''
      - name: Grep .next for fixture sentinel strings
        run: |
          set -e
          # Known unique strings injected by scripts/sandbox-dump.ts
          # augmenter — they only appear in sandbox fixture payloads
          # (no real prod row carries them). If any land in a non-.map
          # file under .next, the build-time alias failed.
          # If you change these, update SENTINEL_* in scripts/sandbox-dump.ts too.
          SENTINELS=(
            "__SANDBOX_FIXTURE__tie_game"
            "__SANDBOX_FIXTURE__draft_pick"
            "__SANDBOX_FIXTURE__phase_team"
            "[augmented] mid-season replacement"
          )
          FAIL=0
          for s in "${SENTINELS[@]}"; do
            HITS=$(grep -r -l -F "$s" .next 2>/dev/null | grep -v '\.map$' || true)
            if [ -n "$HITS" ]; then
              echo "FAIL: fixture sentinel '$s' leaked into .next (non-map files):" >&2
              echo "$HITS" >&2
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Sandbox fixtures leaked into the prod bundle. See docs/sandbox.md."
            exit 1
          fi
          echo "OK: no sandbox fixture bytes found in .next"
